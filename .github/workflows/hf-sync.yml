name: Sync to HF Spaces
on:
  push:
    branches: [main]

# Minimum-required permissions for this workflow. The actual mirror
# happens via a separate HF_TOKEN secret; the workflow only needs to
# READ the repository contents to push them elsewhere. Without an
# explicit block, GitHub falls back to the repo-level default
# (potentially `contents: write`), giving this workflow more power
# than it uses (L10/R4).
permissions:
  contents: read

# Serialise concurrent runs: two PRs merging in quick succession would
# both try to force-push to the same HF Space. Whichever finishes
# second wins and the first push's commit metadata vanishes upstream.
# `cancel-in-progress: false` lets the first run complete so the
# second sees a clean state (rather than a half-pushed mirror).
concurrency:
  group: hf-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      # NOTE (audit): the generic Dockerfile now defaults
      # TRUSTED_PROXIES=127.0.0.1. The HF Space must set
      # TRUSTED_PROXIES=* in its Settings -> Variables (the HF edge
      # proxy sanitises X-Forwarded-For, so the wildcard is safe THERE
      # and required for per-IP rate limiting to see real client IPs).
      - name: Push to HF Spaces
        env:
          # ONE secret, because only one of these is secret. The account
          # and the Space slug are public — the Space itself is public,
          # and its URL is the address people are given. Storing them in
          # the vault cost two setup steps for no protection, hid which
          # Space this repository deploys to from anyone reading the
          # workflow, and had GitHub mask them in the logs, so a failure
          # printed *** where the useful part should have been.
          #
          # A fork cannot push anywhere with this: the token is what
          # authorises, and a fork has none. The check below says so.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OWNER: Ma-Ri-Ba-Ku
          HF_SPACE_NAME: alto-llm-corrector
        # HF Space is a downstream mirror — --force is intentional to
        # overwrite any auto-commits made by HF infrastructure.
        # The token goes through a git credential helper reading env
        # vars, so it never appears in the remote URL (which would leak
        # in `git` error output and process listings).
        run: |
          set -eu
          : "${HF_TOKEN:?HF_TOKEN is not set. It is the only secret this
          workflow needs: create a write token at
          https://huggingface.co/settings/tokens and add it under
          Settings > Secrets and variables > Actions. The Space it pushes
          to is named in this file, not in the vault.}"

          git remote add hf "https://huggingface.co/spaces/$HF_OWNER/$HF_SPACE_NAME"
          git config --local credential.helper \
            '!f() { echo "username=${HF_OWNER}"; echo "password=${HF_TOKEN}"; }; f'
          echo "pushing to https://huggingface.co/spaces/$HF_OWNER/$HF_SPACE_NAME"
          git push hf main --force
